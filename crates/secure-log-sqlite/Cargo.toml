[package]
name = "secure-log-sqlite"
description = "SQLite-backed storage for the secure-log tamper-evident audit log, on sqlink's sqlite-component-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
secure-log = { path = "../secure-log" }
# SQLite substrate: sqlink's sqlite-component-core (pins
# libsqlite3-sys 0.38 with the `bundled` feature). Sharing this
# substrate with wasmos-chronos and other sqlink-derived crates
# lets downstream consumers (e.g. wasmos-runtime taking
# secure-log-sqlite via the audit adapter) link a single copy
# of `libsqlite3-sys` and avoid the Cargo `links = "sqlite3"`
# uniqueness conflict against rusqlite-0.32's older 0.30 pin.
#
# Pinned to a git rev rather than a colocated path so external
# consumers (WCO, citadel, ...) can build against a secure-log tag
# without needing the sqlink/sqlite-wasm sibling checkout that dev
# workspaces have. The rev tracks sqlink's own sqlite-wasm submodule
# so downstream sqlink users see no version drift. Local iteration
# on sqlite-component-core is still possible via an unpublished
# `[patch."https://github.com/tegmentum/sqlite-wasm.git"]` entry
# in the workspace root.
sqlite-component-core = { git = "https://github.com/tegmentum/sqlite-wasm.git", tag = "v0.1.0" }
thiserror.workspace = true
anyhow = "1"

[dev-dependencies]
tempfile.workspace = true
chrono.workspace = true
