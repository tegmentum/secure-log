name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The host-buildable crates: the core library, the SQLite store, and the RPC
  # types (rlibs). The other workspace members are WASM component `cdylib`s
  # (wit-bindgen) that only link on wasm32-wasip2 via cargo-component, so they
  # are not part of this native job.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # secure-log-sqlite depends on sqlink's `sqlite-component-core` via a
      # local path (`../../../sqlink/sqlite-wasm/core`), which expects sqlink
      # as a sibling checkout. actions/checkout can't place a repo outside
      # $GITHUB_WORKSPACE, so clone it directly. `sqlite-wasm` is a git
      # submodule inside sqlink, so recurse. Rewrite any nested git@github.com:
      # submodule URLs to https so unauthenticated CI can fetch them (Track B's
      # .gitmodules declares sqlite-wit with an ssh URL). Floats on sqlink's
      # default branch by design — the two repos evolve together.
      - name: Clone sqlink sibling
        working-directory: ${{ github.workspace }}/..
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/tegmentum/sqlink.git sqlink

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Scoped to the host crates: the WASM component crates have a `mod
      # bindings;` whose file is generated by cargo-component at build time and
      # is absent in a clean checkout, so `fmt --all` can't resolve them.
      - name: Format (host crates)
        run: cargo fmt -p secure-log -p secure-log-sqlite -p secure-log-rpc --check

      - name: Clippy (host crates, deny warnings)
        run: cargo clippy -p secure-log -p secure-log-sqlite -p secure-log-rpc --all-targets -- -D warnings

      - name: Build (host crates)
        run: cargo build -p secure-log -p secure-log-sqlite -p secure-log-rpc --all-targets

      - name: Test (host crates)
        run: cargo test -p secure-log -p secure-log-sqlite -p secure-log-rpc
